<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>型号对标</title>

<style>

:root{

  --br:#e8600a;--nv:#0A1628;--bg:#f3f4f6;--card:#fff;

  --tx:#1a1a2e;--st:#6b7280;--bd:#d1d5db;

  --gr:#16a34a;--rd:#dc2626;--bl:#2563eb

}

*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;min-height:100vh}

.header{background:var(--nv);color:#fff;padding:10px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}

.header-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 10px}

.header-inner > div{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}

.header h1{font-size:1.0em;font-weight:700;white-space:nowrap}

.header .sub{font-size:.7em;color:#94a3b8;white-space:nowrap}

.page-tabs{display:flex;gap:0;background:#fff;border-bottom:2px solid var(--bd);position:sticky;top:64px;z-index:90}

.page-tab{flex:1;max-width:500px;padding:12px 20px;text-align:center;cursor:pointer;font-size:.92em;font-weight:700;color:var(--st);border-bottom:3px solid transparent;transition:all .15s;background:#fafafa;user-select:none}

.page-tab:hover{color:var(--br);background:#fff7ed}

.page-tab.active{color:var(--br);border-bottom-color:var(--br);background:#fff}

.page-content{max-width:1600px;margin:0 auto;padding:12px 20px}

.page-panel{display:none}

.page-panel.active{display:block}

.col-panel{background:var(--card);border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.06);overflow:hidden;margin-bottom:14px}

.col-header{background:var(--nv);color:#fff;padding:10px 16px;font-weight:700;font-size:.88em;display:flex;align-items:center;gap:8px}

.col-body{padding:12px}

.search-box{display:flex;gap:6px;margin-bottom:10px;position:relative}

.suggest-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:2px solid var(--br);border-top:none;border-radius:0 0 8px 8px;max-height:320px;overflow-y:auto;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.15);display:none}

.suggest-dropdown.show{display:block}

.suggest-item{padding:7px 14px;cursor:pointer;font-size:.78em;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:8px;transition:background .1s}

.suggest-item:hover,.suggest-item.active{background:#fff7ed}

.suggest-item:last-child{border-bottom:none}

.suggest-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.85em;font-weight:700;white-space:nowrap;flex-shrink:0}

.suggest-tag.hik{background:#e8600a;color:#fff}

.suggest-tag.comp{background:#2563eb;color:#fff}

.suggest-model{font-family:'Consolas','Courier New',monospace;font-weight:700;color:var(--nv);font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.suggest-info{color:var(--st);font-size:.85em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}

.suggest-series{color:var(--br);font-size:.8em;white-space:nowrap;flex-shrink:0}

.search-box input{flex:1;padding:9px 12px;border:2px solid var(--bd);border-radius:8px;font-size:.86em;outline:none;transition:border-color .15s;background:#fafafa}

.search-box input:focus{border-color:var(--br);background:#fff}

.search-box input::placeholder{color:#bbb}

.search-box button{padding:9px 14px;border:none;border-radius:8px;font-size:.8em;font-weight:600;cursor:pointer;white-space:nowrap;transition:opacity .15s}

.search-box button:hover{opacity:.85}

.btn-search{background:var(--br);color:#fff}

.btn-clear{background:#e5e7eb;color:var(--tx)}

.search-tip{font-size:.68em;color:var(--st);margin-bottom:8px}



/* TABS */

.series-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}

.series-tab{padding:5px 11px;border:1.5px solid var(--bd);border-radius:6px;background:#fff;cursor:pointer;font-size:.76em;font-weight:600;color:var(--st);transition:all .15s;white-space:nowrap}

.series-tab:hover{border-color:var(--br);color:var(--br)}

.series-tab.active{background:var(--br);color:#fff;border-color:var(--br)}

.series-tab.matched{background:#fef3c7;border-color:#ca8a04;color:#92400e}



/* TABLE */

.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px}

.param-table{width:100%;border-collapse:collapse;font-size:.72em;min-width:580px}

.param-table th{background:#1e293b;color:#fff;padding:5px 6px;text-align:center;font-weight:600;white-space:nowrap;font-size:.92em}

.param-table th:first-child{text-align:left;min-width:85px}

.param-table td{padding:4px 6px;border-bottom:1px solid #e5e7eb;text-align:center;vertical-align:middle}

.param-table td:first-child{text-align:left;font-weight:600;white-space:nowrap;color:var(--nv)}

.param-table tr:nth-child(even){background:#fafcfd}

.param-table tr:hover{background:#f3f4f6}

.param-table .model-cell{font-family:'Consolas','Courier New',monospace;font-size:.7em;color:var(--br);font-weight:700;max-width:130px;word-break:break-all}

.param-table .yes{color:var(--gr);font-weight:700}

.param-table .no{color:#bbb}

.param-table .rd{color:var(--rd);font-weight:700}



/* KEY ROW */

.param-table tr.key-row td{background:#fef7ed}

.param-table tr.key-row td:first-child{color:var(--br);font-weight:800}



/* SEARCH HIGHLIGHT */

.param-table tr.search-hit td{background:#fffbeb !important}

.param-table th.search-hit-col{background:#fef9c3 !important;color:#92400e !important;border-bottom:3px solid #e8600a !important}



/* LINK BUTTONS */

.links-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding-top:6px;border-top:1px solid var(--bd)}

.links-row a{display:inline-flex;align-items:center;gap:2px;padding:4px 9px;font-size:.7em;border-radius:5px;text-decoration:none;font-weight:600;white-space:nowrap;transition:opacity .15s}

.links-row a:hover{opacity:.8}

.link-spec{background:#dbeafe;color:#1e40af}

.link-3d{background:#fef3c7;color:#92400e}

.link-manual{background:#f3e8ff;color:#6b21a8}

.link-site{background:#dcfce7;color:#166534}

.link-doc{background:#fff7ed;color:#c2410c;border:1px solid #fdba74;font-size:.73em;padding:5px 10px}



/* EMPTY / NOT FOUND */

.empty-state{text-align:center;padding:30px 20px;color:var(--st)}

.empty-state .big{font-size:2em;margin-bottom:6px;opacity:.6}



/* COMP RESULT */

.comp-counterpart-line{font-size:.78em;color:#075985;background:#f0f9ff;border-left:3px solid #0ea5e9;padding:5px 10px;margin:6px 0;border-radius:0 4px 4px 0;line-height:1.55;word-break:break-word}
.comp-reason{font-size:.75em;color:#57534e;background:#fafaf9;border-left:3px solid #d6d3d1;padding:5px 10px;margin:4px 0 6px;border-radius:0 4px 4px 0;line-height:1.6;word-break:break-word}
.comp-result-header{background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.comp-result-header .badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;font-size:.74em;font-weight:700}

.badge-comp{background:#fee2e2;color:#991b1b}

.badge-hik{background:#fff7ed;color:#c2410c;border:1px solid #fdba74}

.badge-vs{background:#fef9c3;color:#92400e}



.comp-series-card{border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;overflow:hidden}

.comp-series-card .card-title{background:#f8fafc;padding:8px 12px;font-weight:700;font-size:.82em;color:var(--nv);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px}

.comp-series-card .card-body{padding:10px 12px}



/* COMP + HIK SIDE-BY-SIDE */

.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}

.compare-col{min-width:0}

.compare-col .col-label{font-size:.73em;font-weight:700;margin-bottom:6px;padding:3px 8px;border-radius:4px;display:inline-block}

.comp-label{background:#fef2f2;color:#991b1b}

.hik-label{background:#fff7ed;color:#c2410c}



/* HIK COUNTERPART CARD */

.hik-counter{border:2px dashed var(--br);border-radius:8px;padding:10px 12px;background:#fffdf7}

.hik-counter .counter-title{font-weight:700;color:var(--br);margin-bottom:6px;font-size:.82em}

.hik-counter table{font-size:.7em;width:100%;border-collapse:collapse}

.hik-counter td{padding:3px 5px;border-bottom:1px solid #fcd9b8}

.hik-counter td:first-child{font-weight:600;color:var(--st);white-space:nowrap;width:35%}

.hik-counter .mval{font-family:'Consolas','Courier New',monospace;color:var(--br);font-weight:700}



/* MODEL TABLE */

.model-list-table{width:100%;border-collapse:collapse;font-size:.69em;margin-top:6px}

.model-list-table th{background:#334155;color:#fff;padding:4px 5px;text-align:center;font-weight:600;white-space:nowrap}

.model-list-table td{padding:3px 5px;border-bottom:1px solid #e5e7eb;text-align:center}

.model-list-table tr:nth-child(even){background:#f8fafc}

.model-list-table .model-name{font-family:'Consolas','Courier New',monospace;font-size:.68em;color:var(--br);font-weight:700;text-align:left}

.new-badge{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:4px;font-size:.82em;font-weight:700;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;white-space:nowrap;vertical-align:middle;background:#dcfce7;color:#15803d;border:1px solid #86efac}

.search-tip .new-badge{background:#dcfce7;color:#15803d}



/* VS ANALYSIS ROW */

.vs-row{background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:7px 10px;margin-top:8px;font-size:.73em}

.vs-row strong{color:var(--rd)}



/* SEARCH HIT HIGHLIGHT (text level) */

mark.search-mark{background:#fef08a;color:inherit;padding:0 2px;border-radius:2px}



/* RESPONSIVE */

@media(max-width:900px){

  .compare-grid{grid-template-columns:1fr}

  .header{padding:6px 10px}

  .header h1{font-size:.82em}

  .header .sub{font-size:.6em}

  .page-tab{font-size:.72em;padding:8px 8px}

  .col-body{padding:6px !important}

  .search-box input{font-size:.76em;padding:6px 8px}

  .search-box button{padding:6px 10px;font-size:.7em}

  .search-tip{font-size:.6em;margin-bottom:4px}

  .series-tabs{gap:2px;margin-bottom:4px}

  .series-tab{padding:4px 6px;font-size:.65em}

  .param-table{font-size:.6em}

  .model-list-table{font-size:.58em}

  .links-row{gap:2px;margin-top:4px;padding-top:4px}

  .links-row a{padding:3px 6px;font-size:.65em}

  .comp-result-header{padding:6px 8px;font-size:.7em}

  .card-title{padding:5px 8px;font-size:.7em}

  .card-body{padding:6px 8px}

  .vs-row{padding:4px 6px;font-size:.65em;margin-top:4px}

  .empty-state{padding:20px 12px}

  .empty-state .big{font-size:2em}

  .empty-state p{font-size:.75em}

}


/* ===== 一对一型号参数对标（2026-11-04） ===== */
.pair-wrap{margin:10px 0 6px}
.pair-head{font-size:.9em;font-weight:700;color:#374151;margin:6px 0 10px}
.pair-grid{display:grid;grid-template-columns:1fr 44px 1fr;gap:10px;align-items:stretch}
.pair-card{border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;min-width:0}
.pair-foreign{border-top:3px solid #64748b;background:#f8fafc}
.pair-hik{border-top:3px solid #c8102e;background:#fffafa}
.pair-card-tag{display:inline-block;font-size:.72em;font-weight:700;padding:2px 10px;border-radius:12px;color:#fff;background:#64748b;margin-bottom:8px;letter-spacing:.02em}
.pair-hik .pair-card-tag{background:#c8102e}
.pair-model{font-size:1.05em;font-weight:800;color:#111827;word-break:break-all;line-height:1.35}
.pair-hik .pair-model{color:#c8102e}
.pair-sub{font-size:.78em;color:#6b7280;margin:4px 0 10px}
.pair-params{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:.8em}
.pair-params dt{color:#6b7280;white-space:nowrap;font-weight:600}
.pair-params dd{margin:0;color:#1f2937;word-break:break-word;line-height:1.55}
.pair-vs{display:flex;align-items:center;justify-content:center;font-weight:800;color:#9ca3af;font-size:.85em}
.adv-box{margin-top:14px;border:1px solid #f0c36d;border-radius:10px;overflow:hidden}
.adv-title{background:#fff7e8;color:#8a5a00;font-weight:700;padding:9px 12px;font-size:.88em;border-bottom:1px solid #f0c36d}
.adv-row{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border-bottom:1px solid #f3f4f6;font-size:.82em}
.adv-row:last-child{border-bottom:0}
.adv-no{flex:0 0 18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:#c8102e;color:#fff;font-size:.85em;font-weight:700}
.adv-key{flex:0 0 88px;font-weight:700;color:#c8102e}
.adv-val{flex:1;color:#374151;line-height:1.55}
@media(max-width:760px){.pair-grid{grid-template-columns:1fr;gap:8px}.pair-vs{padding:2px 0}.adv-key{flex:0 0 74px}.adv-row{flex-wrap:wrap}}
.suggest-head{padding:7px 14px;background:#fff7ed;border-bottom:1px solid #fed7aa;font-size:.72em;color:#9a3412;font-weight:700}
.suggest-empty{padding:10px 14px;font-size:.76em;color:#6b7280;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.quick-chip{display:inline-block;padding:2px 9px;border:1px solid #f0c36d;border-radius:12px;background:#fffbeb;color:#8a5a00;cursor:pointer;font-size:.95em}
.quick-chip:hover{background:#fde68a}
.match-hint{margin:0 0 10px;padding:8px 12px;border:1px dashed #f0c36d;border-radius:8px;background:#fffbeb;color:#8a5a00;font-size:.78em;line-height:1.6}
.empty-chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.empty-chips .quick-chip{font-size:1em}
@media(max-width:760px){.suggest-head{font-size:.68em}.suggest-series{display:none}.match-hint{font-size:.72em}}

/* ===== 极简界面（2026-11-04）：仅一个检索框 ===== */
.intro{font-size:.78em;color:#6b7280;margin:0 0 10px;letter-spacing:.02em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:920px;margin:0 auto;padding:34px 16px 48px}
.search-box{margin:0}
.search-box input{min-width:0;padding:12px 16px;font-size:.95em;border-radius:10px;background:#fff;border-color:#e2e8f0;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.search-box button{flex:0 0 auto;padding:12px 22px;font-size:.88em;border-radius:10px}
.suggest-head{font-size:.7em}
.match-hint{margin:14px 0 10px;padding:7px 12px;font-size:.76em;border-style:solid;border-color:#fde3b0;background:#fffdf7}
.adv-title{font-size:.82em;padding:8px 12px}
.pair-wrap{margin:0}
@media(max-width:760px){.wrap{padding:18px 10px 32px}.search-box input{padding:10px 12px;font-size:.88em}.search-box button{padding:10px 14px;font-size:.8em}}
</style>

</head>

<main class="wrap">
  <div class="intro">友商型号 → 海康型号 · 一对一参数对标</div>
  <div class="search-box">
    <input type="text" id="comp-search" placeholder="搜索型号或关键词" onkeydown="suggestKeydown(event,'comp')" oninput="_debounceSuggest('comp')" autocomplete="off">
    <button class="btn-search" onclick="doCompSearch()">搜索</button>
    <div class="suggest-dropdown" id="comp-suggest"></div>
  </div>
  <div id="comp-empty"></div>
  <div id="comp-result"></div>
</main>

// ==================== COMPETITOR SEARCH ====================

function matchSeries(qn, searchKeys){

  if(!searchKeys)return false;

  return searchKeys.some(sk=>{

    // Exact match

    if(qn===sk)return true;

    // Query starts with searchKey (full model "is3901mc" also matches key "is3901")

    if(qn.length>sk.length && qn.startsWith(sk))return true;

    // Substring (hyphen-insensitive): prefixed full model "opt-sca1-50mc" contains key "sca1"

    if(qn.length>sk.length && qn.replace(/-/g,'').indexOf(sk.replace(/-/g,''))>=0)return true;

    // SearchKey starts with query (e.g., query "iv4" matches key "iv4-400")

    if(sk.length>qn.length && sk.startsWith(qn)){

      const nc=sk[qn.length];

      if(!/[a-z0-9]/.test(nc))return true; // word boundary

    }

    return false;

  });

}



// Find Hik counterpart key from query

function findHikKey(qn){

  // Try exact match in counterpartMap

  if(counterpartMap[qn])return counterpartMap[qn];

  // Longest-prefix key first (handles full model queries like "is3901mc" / "vs-c320mx")

  let best=null,bestLen=0;

  for(const k in counterpartMap){

    if(qn.startsWith(k)&&k.length>bestLen){best=counterpartMap[k];bestLen=k.length;}

  }

  if(best)return best;

  // Word-boundary prefix match (query shorter than key, e.g. "ss4" hits "ss4000")

  for(const [k,v] of Object.entries(counterpartMap)){

    if(qn.startsWith(k)&&(qn.length===k.length||!/[a-z0-9]/.test(qn[k.length])))return v;

    if(k.startsWith(qn)&&(k.length===qn.length||!/[a-z0-9]/.test(k[qn.length])))return v;

  }

  // Longest substring key (>=4 chars, hyphens ignored) for prefixed full models like "opt-sca1-c023g-l12"

  let sub=null,subLen=3;

  const qnh=qn.replace(/-/g,'');

  for(const k in counterpartMap){

    if(k.length>=4&&qnh.indexOf(k.replace(/-/g,''))>=0&&k.length>subLen){sub=counterpartMap[k];subLen=k.length;}

  }

function qnn(s){return String(s||'').toLowerCase().replace(/[^a-z0-9-一-龥]/g,'');}
function expandQueries(qn){const out=[qn];let m=/^(\d+(?:\.\d+)?)万$/.exec(qn);if(m){out.push(String(parseFloat(m[1])/100)+'mp');}m=/^(\d+(?:\.\d+)?)mp$/.exec(qn);if(m){out.push(String(parseFloat(m[1])*100)+'万');}return out;}
function hayMatch(qn,text){if(!text)return false;const hay=qnn(text).replace(/-/g,'');return expandQueries(qn).some(q=>q&&hay.indexOf(q.replace(/-/g,''))>=0);}

// ==================== 一对一型号参数对标模式（2026-11-04 二次修正） ====================
// 规则：输入一个友商目标型号 → 只呈现一组对标；
//       左侧「友商」单型号 + 参数，右侧「海康」单型号 + 参数；
//       对比区逐项写出海康型号相对该友商型号的优势；
//       不列候选清单、不列多个型号、不呈现多组结果。
// pairData 由权威 CSV《竞品对标完整对照表》生成，一行 = 一组一对一映射（13 列）。

function escP(s){return String(s==null?'':s).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
function pnorm(s){return String(s||'').toLowerCase().replace(/[\s_./\\()（）\[\]·、,，:：+＋]/g,'').replace(/-/g,'');}

function expandPairQueries(raw){
  const q=String(raw||'').trim().toLowerCase(), out=[q];
  let m=/^(\d+(?:\.\d+)?)万$/.exec(q);
  if(m){const v=parseFloat(m[1]);out.push(String(v/100)+'mp');out.push(String(v*10000)+'像素');}
  m=/^(\d+(?:\.\d+)?)mp$/.exec(q);
  if(m){const v=parseFloat(m[1]);out.push(String(v*100)+'万');}
  m=/^(\d+(?:\.\d+)?)mm$/.exec(q);
  if(m){out.push(m[1]+'m');out.push('0'+m[1]+'m');}
  if(/近红外|红外/i.test(q))out.push('红外');
  return out.filter(Boolean);
}

function pairScore(r,qs,raw){
  const model=pnorm(r[2]), hikModel=pnorm(r[7]);
  const series=pnorm(r[1]), brand=pnorm(r[0]), hikSeries=pnorm(r[6]), all=pnorm(r.join(' '));
  let best=0;
  qs.forEach(function(q){
    const nq=pnorm(q); if(!nq)return;
    if(model===nq)best=Math.max(best,1000);
    else if(model.indexOf(nq)===0)best=Math.max(best,900);
    else if(model.indexOf(nq)>=0)best=Math.max(best,800);
    if(hikModel===nq)best=Math.max(best,950);
    else if(hikModel.indexOf(nq)>=0)best=Math.max(best,700);
    if(series.indexOf(nq)>=0)best=Math.max(best,500);
    if(brand.indexOf(nq)>=0)best=Math.max(best,420);
    if(hikSeries.indexOf(nq)>=0)best=Math.max(best,380);
    if(all.indexOf(nq)>=0)best=Math.max(best,120);
    if(/^\d+(?:\.\d+)?mp$/.test(nq)&&String(r[3]||'').toLowerCase().indexOf(nq)>=0)best=Math.max(best,700);
  });
  if(/晶圆|wafer|6500p|ai-wid/i.test(String(raw||''))&&/SC6500P|AI-WID/i.test(String(r[7]||'')))best=Math.max(best,940);
  return best;
}

function matchKind(r,raw){
  const q=pnorm(raw),m=pnorm(r[2]),hm=pnorm(r[7]);
  if(m===q)return '完整型号精确命中';
  if(m.indexOf(q)===0)return '型号前缀命中';
  if(m.indexOf(q)>=0)return '型号片段命中';
  if(hm.indexOf(q)>=0||q===pnorm('SC6500P'))return '海康型号反查';
  if(pnorm(r[1]).indexOf(q)>=0)return '友商系列命中';
  if(pnorm(r[6]).indexOf(q)>=0)return '海康系列命中';
  return '参数/关键词模糊命中';
}
function pickOnePair(raw){
  const qs=expandPairQueries(raw);
  let best=null,bs=0;
  pairData.forEach(function(r){const s=pairScore(r,qs,raw);if(s>bs){bs=s;best=r;}});
  return best;
}

function numFps(s){
  const t=String(s||'').trim(); let m;
  if(m=/^(\d+(?:\.\d+)?)\s*(?:fps)?$/i.exec(t))return parseFloat(m[1]);
  if(m=/(\d+(?:\.\d+)?)\s*fps/i.exec(t))return parseFloat(m[1]);
  if(m=/^(\d+(?:\.\d+)?)\s*[\/／]/.exec(t))return parseFloat(m[1]);
  return null;
}
function pxCount(s){
  const m=String(s||'').match(/(\d{3,5})\s*[×xX*]\s*(\d{3,5})/);
  return m?parseInt(m[1],10)*parseInt(m[2],10):null;
}

function buildAdvantages(r){
  const out=[],diff=String(r[12]||''),reason=String(r[11]||'');
  function classify(t){
    if(/fps|帧率/.test(t))return '帧率';
    if(/分辨率|像素|×/.test(t))return '分辨率';
    if(/快门/.test(t))return '快门';
    if(/AI|学习|算法|算子|OCR|HDR/.test(t))return 'AI 能力';
    if(/IP\d|防护/.test(t))return '防护等级';
    if(/光/.test(t))return '光源';
    if(/协议|生态|VM|平台|透明|通讯/.test(t))return '生态与平台';
    return '综合';
  }
  function normTxt(x){return String(x||'').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g,'');}
  function add(k,v){
    v=String(v||'').trim().replace(/^[；;，,、\s]+|[；;，,、\s]+$/g,'');
    if(!v)return;
    const nv=normTxt(v), nums=(v.match(/\d+(?:\.\d+)?/g)||[]);
    for(const o of out){
      const no=normTxt(o.v), onums=(o.v.match(/\d+(?:\.\d+)?/g)||[]);
      if(no===nv)return;
      if(o.k===k&&(no.indexOf(nv)>=0||nv.indexOf(no)>=0))return;
      if(o.k===k&&nums.length&&onums.length&&nums.some(x=>onums.indexOf(x)>=0))return;
      // 同项目且共享四字以上中文短语 → 视为同义重复，保留先写入的（更具体）条目
      const h4=nv.match(/[\u4e00-\u9fa5]{4}/), h4o=no.match(/[\u4e00-\u9fa5]{4}/);
      if(o.k===k&&h4&&no.indexOf(h4[0])>=0)return;
      if(o.k===k&&h4o&&nv.indexOf(h4o[0])>=0)return;
    }
    out.push({k:k,v:v});
  }
  // ① 参数差异列中明确标注「海康优势」的条目（排除友商占优条目）
  diff.split(/[；;]/).forEach(function(seg){
    const t=seg.trim();if(!t)return;
    const hikWin=/海康[^）)]{0,12}优势|\(海康优势\)|（海康优势）|海康AI优势/.test(t);
    const foeWin=/友商[^）)]{0,12}优势|友商速度优势|友商优势/.test(t);
    if(!hikWin||foeWin)return;
    add(classify(t),t);
  });
  // ② 帧率客观数值对比
  const hf=numFps(r[9]),cf=numFps(r[4]);
  if(hf!=null&&cf!=null&&hf>cf)add('帧率','官方 '+hf+'fps 高于友商 '+cf+'fps，检测节拍更快');
  else if(hf!=null&&cf==null)add('帧率','官方明确公布 '+hf+'fps；友商未公布帧率，参数可背书');
  // ③ 分辨率像素数客观对比
  const hp=pxCount(r[8]),cp=pxCount(r[3]);
  if(hp&&cp&&hp>cp){
    const cm=String(r[3]).match(/\d{3,5}\s*[×xX*]\s*\d{3,5}/);
    add('分辨率','海康 '+r[8]+'（约'+(hp/1e6).toFixed(2)+'MP）高于友商 '+(cm?cm[0]:'标称值'));
  }
  // ④ 快门形态
  if(/卷帘/.test(String(r[3])+diff)&&/全局快门/.test(diff+reason))add('快门','全局快门对友商卷帘快门，高速运动成像无拖影');
  // ⑤ AI 能力（仅当友商无内置 AI / 仅基础能力时才计为优势）
  if(r[10]&&(/无内置AI|基础算子|仅基础|无AI|^[—\-]$|未标注/.test(String(r[5]).trim())||!String(r[5]).trim())){
    add('AI 能力','海康：'+r[10]+'；友商：'+(r[5]||'未标注'));
  }
  // ⑥ 对标原因中的海康优势段（按内容归类，去掉与参数对比重复的条目）
  let m=/海康[^：:；;。]{0,40}优势[:：]([^；;。]+)/.exec(reason);
  if(m){
    const parts=m[1].split(/[+＋、]/).map(function(x){return x.trim();}).filter(Boolean);
    // 合并被 + 误拆的「数字结尾 + 名词」连写（如 VM完整版140+视觉工具、30+通讯协议）
    for(let i=0;i<parts.length-1;i++){
      if(/\d$/.test(parts[i])&&/^[\u4e00-\u9fa5]/.test(parts[i+1])){parts[i]=parts[i]+'+'+parts[i+1];parts.splice(i+1,1);}
    }
    parts.forEach(function(x){add(classify(x),x);});
  }
  m=/海康[^；;。]{0,60}(?:带|支持|开放)[^；;。]+/.exec(reason);
  if(m&&out.length<4)add(classify(m[0]),m[0].replace(/^海康/,''));
  // ⑦ 兜底：本行对标说明中含「海康」的完整句
  if(out.length<2){
    reason.split(/[；;。]/).forEach(function(t){
      if(out.length>=3)return;
      const x=t.trim();
      if(x.length>=10&&/海康/.test(x)&&!/^(友商|康耐视|基恩士|思谋|OPT|华睿|德成)/.test(x))add(classify(x),x);
    });
  }
  // ⑧ 品牌级对标说明兜底
  if(out.length<2){
    try{
      const br=String(r[0]||'').split(' ')[0];
      const c=compData.find(function(x){return x.brand&&x.brand.indexOf(br)>=0;});
      if(c&&c.reason){const mm=/海康优势[:：]([^；;。]+)/.exec(c.reason);if(mm)add(classify(mm[1]),mm[1]);}
    }catch(e){}
  }
  if(!out.length)add('综合','本组以参数对齐为主，海康型号参数官方公开、可逐项核验');
  // ⑨ 机型能力护栏：晶圆专用客户端/晶圆ID大模型仅 SC6500P-AI-WID 具备，常规 SC6000 不具备
  const waferModel=/SC6500P|AI-WID/i.test(String(r[7]||'')+' '+String(r[6]||''));
  let final=out;
  if(!waferModel){
    final=out.filter(function(a){return !/晶圆|36,?000|SEMI标准OCR|专用客户端|晶圆ID大模型/i.test(a.v);});
    if(!final.length)final=[{k:'综合',v:'常规系列优势：VM算法平台+官方公开参数可逐项核验；晶圆专用客户端与大模型仅 SC6500P-AI-WID 具备'}];
  }else if(!final.some(function(a){return /晶圆|36,?000/.test(a.v);})){
    final.push({k:'晶圆专用',v:'仅 SC6500P-AI-WID 具备晶圆专用客户端与晶圆ID大模型（SEMI标准OCR，36,000片/时@≥99.9%）；常规 SC6000 系列不具备'});
  }
  return final.slice(0,8);
}

function pairParamRows(r,side){
  const rows=(side==='hik')
    ? [['品牌','海康机器人 HIKROBOT'],['对标系列',r[6]],['分辨率',r[8]],['帧率',r[9]+' fps'],['AI 能力',r[10]]]
    : [['品牌',r[0]],['所属系列',r[1]],['分辨率 / 规格',r[3]],['帧率',r[4]],['AI 能力',r[5]]];
  return rows.map(function(x){
    return '<dt>'+escP(x[0])+'</dt><dd>'+escP(x[1]||'—')+'</dd>';
  }).join('');
}

function renderPair(r,q,mk){
  const adv=buildAdvantages(r);
  let h='<div class="pair-wrap">';
  h+='<div class="match-hint">🔎 '+escP(q||'')+' → '+escP(r[2])+'</div>';
  h+='<div class="pair-grid">';
  h+='<div class="pair-card pair-foreign"><div class="pair-card-tag">友商</div>'
    +'<div class="pair-model">'+escP(r[2])+'</div>'
    +'<div class="pair-sub">'+escP(r[0])+'</div>'
    +'<dl class="pair-params">'+pairParamRows(r,'comp')+'</dl></div>';
  h+='<div class="pair-vs">VS</div>';
  h+='<div class="pair-card pair-hik"><div class="pair-card-tag">海康</div>'
    +'<div class="pair-model">'+escP(r[7])+'</div>'
    +'<div class="pair-sub">'+escP(r[6])+'</div>'
    +'<dl class="pair-params">'+pairParamRows(r,'hik')+'</dl></div>';
  h+='</div>';
  h+='<div class="adv-box"><div class="adv-title">海康优势</div>';
  adv.forEach(function(a,i){
    h+='<div class="adv-row"><span class="adv-no">'+(i+1)+'</span><span class="adv-key">'+escP(a.k)+'</span><span class="adv-val">'+escP(a.v)+'</span></div>';
  });
  h+='</div></div>';
  return h;
}

function doCompSearch(){
  const rawQ=document.getElementById('comp-search').value.trim();
  if(!rawQ)return;
  document.getElementById('comp-empty').style.display='none';
  const container=document.getElementById('comp-result');
  const r=pickOnePair(rawQ);
  if(!r){
    container.innerHTML='<div class="empty-state">未找到匹配</div>';
    return;
  }
  container.innerHTML=renderPair(r,rawQ,matchKind(r,rawQ));
}

function clearCompSearch(){
  document.getElementById('comp-search').value='';
  document.getElementById('comp-result').innerHTML='';
  document.getElementById('comp-empty').style.display='';
}

/* ===== 模糊搜索提示（基于 pairData 136 组一对一数据，2026-11-04 重建） ===== */
let _suggestIndex=null,_suggestActiveIdx=-1,_suggestCurrentList=[],_suggestTimer=null;
const QUICK_WORDS=['500万','1200万','1600万','读码','晶圆','全局快门','近红外','IS3800','IS2800','VN4000','SC6500P','SC6000','SC3000','IV4'];

function buildSuggestIndex(){
  if(_suggestIndex)return _suggestIndex;
  const list=[],seen={};
  function push(kind,text,info,series,query){
    text=String(text||'').trim();if(!text)return;
    const key=kind+'|'+text;if(seen[key])return;seen[key]=1;
    list.push({kind:kind,text:text,info:info||'',series:series||'',query:query||text,hay:pnorm(text+' '+(info||'')+' '+(series||''))});
  }
  pairData.forEach(function(r){
    push('型号',r[2],String(r[3]||'').slice(0,40)+' · '+String(r[0]||'').split(' ')[0],(r[1]||'').replace(/系列.*/,'')+' → '+(r[7]||''),String(r[2]||''));
    push('系列',String(r[1]||'').replace(/\(.*?\)/g,'').trim(),'友商系列关键词',String(r[0]||'').split(' ')[0],String(r[2]||''));
    push('海康',String(r[7]||''),'海康型号 → 友商 '+(r[2]||''),String(r[6]||''),String(r[7]||''));
    push('系列',String(r[6]||'').replace(/系列.*/,'').trim(),'海康系列关键词','',String(r[7]||''));
  });
  QUICK_WORDS.forEach(function(q){push('关键词',q,'模糊词（像素 / 场景 / 参数 / 系列）','');});
  _suggestIndex=list;return list;
}

function suggestScore(item,qs){
  const t=pnorm(item.text),h=item.hay;let best=0;
  qs.forEach(function(x){
    const nx=pnorm(x);if(!nx)return;
    if(t===nx)best=Math.max(best,1000);
    else if(t.indexOf(nx)===0)best=Math.max(best,850);
    else if(t.indexOf(nx)>=0)best=Math.max(best,650);
    else if(h.indexOf(nx)>=0)best=Math.max(best,300);
  });
  if(best<=0)return 0;
  if(item.kind==='型号')best+=60;
  if(item.kind==='关键词')best+=40;
  return best;
}

function showSuggest(){
  const input=document.getElementById('comp-search'),dd=document.getElementById('comp-suggest');
  const raw=input.value.trim();
  if(!raw){dd.classList.remove('show');dd.innerHTML='';_suggestCurrentList=[];return;}
  const qs=expandPairQueries(raw),idx=buildSuggestIndex(),results=[];
  idx.forEach(function(it){const sc=suggestScore(it,qs);if(sc>0)results.push({item:it,score:sc});});
  results.sort(function(a,b){return b.score-a.score;});
  const picks=[],seenText={};
  results.forEach(function(x){
    if(picks.length>=8)return;
    if(seenText[x.item.text])return;seenText[x.item.text]=1;picks.push(x.item);
  });
  _suggestCurrentList=picks;_suggestActiveIdx=-1;
  let html='<div class="suggest-head">🔎 提示</div>';
  if(!picks.length){
    html+='<div class="suggest-empty">无匹配提示</div>';
  }else{
    picks.forEach(function(it,i){
      html+='<div class="suggest-item" data-idx="'+i+'" onmousedown="clickSuggest('+i+');return false">'
        +'<span class="suggest-tag '+(it.kind==='海康'?'hik':'comp')+'">'+escP(it.kind)+'</span>'
        +'<span class="suggest-model">'+escP(it.text)+'</span>'
        +'<span class="suggest-info">'+escP(it.info)+'</span>'
        +'<span class="suggest-series">'+escP(it.series)+'</span></div>';
    });
  }
  dd.innerHTML=html;dd.classList.add('show');
}

function _debounceSuggest(){
  clearTimeout(_suggestTimer);
  _suggestTimer=setTimeout(function(){showSuggest();},120);
}

function clickSuggest(idx){
  const item=_suggestCurrentList[idx];if(!item)return;
  const input=document.getElementById('comp-search'),dd=document.getElementById('comp-suggest');
  input.value=item.query||item.text;
  dd.classList.remove('show');dd.innerHTML='';_suggestCurrentList=[];
  doCompSearch();
}

function suggestKeydown(e){
  const dd=document.getElementById('comp-suggest');
  if(e.key==='Enter'){
    if(dd.classList.contains('show')&&_suggestActiveIdx>=0&&_suggestCurrentList[_suggestActiveIdx]){e.preventDefault();clickSuggest(_suggestActiveIdx);}
    else{e.preventDefault();dd.classList.remove('show');doCompSearch();}
  }else if(e.key==='ArrowDown'){
    e.preventDefault();
    _suggestActiveIdx=Math.min(_suggestActiveIdx+1,_suggestCurrentList.length-1);
    updateSuggestActive(dd);
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    _suggestActiveIdx=Math.max(_suggestActiveIdx-1,0);
    updateSuggestActive(dd);
  }else if(e.key==='Escape'){
    dd.classList.remove('show');dd.innerHTML='';_suggestCurrentList=[];_suggestActiveIdx=-1;
  }
}

function updateSuggestActive(dd){
  const items=dd.querySelectorAll('.suggest-item');
  items.forEach(function(el,i){
    if(i===_suggestActiveIdx)el.classList.add('active');else el.classList.remove('active');
  });
  const act=items[_suggestActiveIdx];if(act&&act.scrollIntoView)act.scrollIntoView({block:"nearest"});
}

// Close dropdown when clicking outside

document.addEventListener('click', function(e){

  if(!e.target.closest('.search-box')){

    document.querySelectorAll('.suggest-dropdown').forEach(dd=>{

      dd.classList.remove('show');

      dd.innerHTML = '';

    });

    _suggestCurrentList = [];

    _suggestActiveIdx = -1;

  }

});
