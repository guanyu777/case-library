<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>海康智能相机产品检索 — 全系列型号</title>

<style>

:root{

  --br:#e8600a;--nv:#0A1628;--bg:#f3f4f6;--card:#fff;

  --tx:#1a1a2e;--st:#6b7280;--bd:#d1d5db;

  --gr:#16a34a;--rd:#dc2626;--bl:#2563eb

}

*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;min-height:100vh}

.header{background:var(--nv);color:#fff;padding:10px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}

.header-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 10px}

.header-inner > div{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}

.header h1{font-size:1.0em;font-weight:700;white-space:nowrap}

.header .sub{font-size:.7em;color:#94a3b8;white-space:nowrap}

.page-tabs{display:flex;gap:0;background:#fff;border-bottom:2px solid var(--bd);position:sticky;top:64px;z-index:90}

.page-tab{flex:1;max-width:500px;padding:12px 20px;text-align:center;cursor:pointer;font-size:.92em;font-weight:700;color:var(--st);border-bottom:3px solid transparent;transition:all .15s;background:#fafafa;user-select:none}

.page-tab:hover{color:var(--br);background:#fff7ed}

.page-tab.active{color:var(--br);border-bottom-color:var(--br);background:#fff}

.page-content{max-width:1600px;margin:0 auto;padding:12px 20px}

.page-panel{display:none}

.page-panel.active{display:block}

.col-panel{background:var(--card);border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.06);overflow:hidden;margin-bottom:14px}

.col-header{background:var(--nv);color:#fff;padding:10px 16px;font-weight:700;font-size:.88em;display:flex;align-items:center;gap:8px}

.col-body{padding:12px}

.search-box{display:flex;gap:6px;margin-bottom:10px;position:relative}

.suggest-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:2px solid var(--br);border-top:none;border-radius:0 0 8px 8px;max-height:320px;overflow-y:auto;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.15);display:none}

.suggest-dropdown.show{display:block}

.suggest-item{padding:7px 14px;cursor:pointer;font-size:.78em;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:8px;transition:background .1s}

.suggest-item:hover,.suggest-item.active{background:#fff7ed}

.suggest-item:last-child{border-bottom:none}

.suggest-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.85em;font-weight:700;white-space:nowrap;flex-shrink:0}

.suggest-tag.hik{background:#e8600a;color:#fff}

.suggest-tag.comp{background:#2563eb;color:#fff}

.suggest-model{font-family:'Consolas','Courier New',monospace;font-weight:700;color:var(--nv);font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.suggest-info{color:var(--st);font-size:.85em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}

.suggest-series{color:var(--br);font-size:.8em;white-space:nowrap;flex-shrink:0}

.search-box input{flex:1;padding:9px 12px;border:2px solid var(--bd);border-radius:8px;font-size:.86em;outline:none;transition:border-color .15s;background:#fafafa}

.search-box input:focus{border-color:var(--br);background:#fff}

.search-box input::placeholder{color:#bbb}

.search-box button{padding:9px 14px;border:none;border-radius:8px;font-size:.8em;font-weight:600;cursor:pointer;white-space:nowrap;transition:opacity .15s}

.search-box button:hover{opacity:.85}

.btn-search{background:var(--br);color:#fff}

.btn-clear{background:#e5e7eb;color:var(--tx)}

.search-tip{font-size:.68em;color:var(--st);margin-bottom:8px}



/* TABS */

.series-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}

.series-tab{padding:5px 11px;border:1.5px solid var(--bd);border-radius:6px;background:#fff;cursor:pointer;font-size:.76em;font-weight:600;color:var(--st);transition:all .15s;white-space:nowrap}

.series-tab:hover{border-color:var(--br);color:var(--br)}

.series-tab.active{background:var(--br);color:#fff;border-color:var(--br)}

.series-tab.matched{background:#fef3c7;border-color:#ca8a04;color:#92400e}



/* TABLE */

.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px}

.param-table{width:100%;border-collapse:collapse;font-size:.72em;min-width:580px}

.param-table th{background:#1e293b;color:#fff;padding:5px 6px;text-align:center;font-weight:600;white-space:nowrap;font-size:.92em}

.param-table th:first-child{text-align:left;min-width:85px}

.param-table td{padding:4px 6px;border-bottom:1px solid #e5e7eb;text-align:center;vertical-align:middle}

.param-table td:first-child{text-align:left;font-weight:600;white-space:nowrap;color:var(--nv)}

.param-table tr:nth-child(even){background:#fafcfd}

.param-table tr:hover{background:#f3f4f6}

.param-table .model-cell{font-family:'Consolas','Courier New',monospace;font-size:.7em;color:var(--br);font-weight:700;max-width:130px;word-break:break-all}

.param-table .yes{color:var(--gr);font-weight:700}

.param-table .no{color:#bbb}

.param-table .rd{color:var(--rd);font-weight:700}



/* KEY ROW */

.param-table tr.key-row td{background:#fef7ed}

.param-table tr.key-row td:first-child{color:var(--br);font-weight:800}



/* SEARCH HIGHLIGHT */

.param-table tr.search-hit td{background:#fffbeb !important}

.param-table th.search-hit-col{background:#fef9c3 !important;color:#92400e !important;border-bottom:3px solid #e8600a !important}



/* LINK BUTTONS */

.links-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:6px;border-top:1px solid var(--bd)}

.links-row a{display:inline-flex;align-items:center;gap:3px;padding:5px 11px;font-size:.72em;border-radius:6px;text-decoration:none;font-weight:700;white-space:nowrap;cursor:pointer;border:1.5px solid transparent;transition:all .18s ease}

.links-row a::after{content:"↗";font-size:.85em;font-weight:800;opacity:.75;transition:transform .18s ease}

.links-row a:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.14)}

.links-row a:hover::after{transform:translate(1px,-1px)}

.link-spec{background:#eff6ff;color:#1d4ed8;border-color:#93c5fd}

.link-spec:hover{background:#1d4ed8;color:#fff;border-color:#1d4ed8}

.link-3d{background:#fefce8;color:#a16207;border-color:#fde047}

.link-3d:hover{background:#a16207;color:#fff;border-color:#a16207}

.link-manual{background:#faf5ff;color:#7e22ce;border-color:#d8b4fe}

.link-manual:hover{background:#7e22ce;color:#fff;border-color:#7e22ce}

.link-site{background:#ecfdf5;color:#047857;border-color:#6ee7b7}

.link-site:hover{background:#047857;color:#fff;border-color:#047857}

.link-doc{background:#fff7ed;color:#c2410c;border-color:#fdba74;font-size:.74em;padding:5px 11px}

.link-doc:hover{background:#c2410c;color:#fff;border-color:#c2410c}



/* EMPTY / NOT FOUND */

.empty-state{text-align:center;padding:30px 20px;color:var(--st)}

.empty-state .big{font-size:2em;margin-bottom:6px;opacity:.6}



/* COMP RESULT */

.comp-result-header{background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.comp-result-header .badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;font-size:.74em;font-weight:700}

.badge-comp{background:#fee2e2;color:#991b1b}

.badge-hik{background:#fff7ed;color:#c2410c;border:1px solid #fdba74}

.badge-vs{background:#fef9c3;color:#92400e}



.comp-series-card{border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;overflow:hidden}

.comp-series-card .card-title{background:#f8fafc;padding:8px 12px;font-weight:700;font-size:.82em;color:var(--nv);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px}

.comp-series-card .card-body{padding:10px 12px}



/* COMP + HIK SIDE-BY-SIDE */

.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}

.compare-col{min-width:0}

.compare-col .col-label{font-size:.73em;font-weight:700;margin-bottom:6px;padding:3px 8px;border-radius:4px;display:inline-block}

.comp-label{background:#fef2f2;color:#991b1b}

.hik-label{background:#fff7ed;color:#c2410c}



/* HIK COUNTERPART CARD */

.hik-counter{border:2px dashed var(--br);border-radius:8px;padding:10px 12px;background:#fffdf7}

.hik-counter .counter-title{font-weight:700;color:var(--br);margin-bottom:6px;font-size:.82em}

.hik-counter table{font-size:.7em;width:100%;border-collapse:collapse}

.hik-counter td{padding:3px 5px;border-bottom:1px solid #fcd9b8}

.hik-counter td:first-child{font-weight:600;color:var(--st);white-space:nowrap;width:35%}

.hik-counter .mval{font-family:'Consolas','Courier New',monospace;color:var(--br);font-weight:700}



/* MODEL TABLE */

.model-list-table{width:100%;border-collapse:collapse;font-size:.69em;margin-top:6px}

.model-list-table th{background:#334155;color:#fff;padding:4px 5px;text-align:center;font-weight:600;white-space:nowrap}

.model-list-table td{padding:3px 5px;border-bottom:1px solid #e5e7eb;text-align:center}

.model-list-table tr:nth-child(even){background:#f8fafc}

.model-list-table .model-name{font-family:'Consolas','Courier New',monospace;font-size:.68em;color:var(--br);font-weight:700;text-align:left}



/* VS ANALYSIS ROW */

.vs-row{background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:7px 10px;margin-top:8px;font-size:.73em}

.vs-row strong{color:var(--rd)}



/* SEARCH HIT HIGHLIGHT (text level) */

mark.search-mark{background:#fef08a;color:inherit;padding:0 2px;border-radius:2px}



/* MODEL DETAIL CARD */

.model-list-hint{font-size:.72em;color:#16a34a;margin:6px 0;padding:5px 10px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px}

.model-row{cursor:pointer;transition:background .12s}

.model-row:hover{background:#fff7ed}

.model-row.selected{background:#fef3c7;box-shadow:inset 3px 0 0 var(--br)}

.model-detail-card{border:2px solid var(--br);border-radius:8px;margin-top:10px;overflow:hidden;background:#fffdf7;box-shadow:0 2px 8px rgba(232,96,10,.1)}

.mdc-title{background:var(--br);color:#fff;padding:8px 12px;font-weight:700;font-size:.9em}

.mdc-body{padding:10px 12px}

.mdc-fov-title{font-weight:700;color:var(--nv);margin:10px 0 6px;font-size:.82em}

.fov-sensor{font-size:.72em;color:var(--st);margin-bottom:6px;padding:4px 8px;background:#f0f9ff;border-radius:4px}

.fov-formula{font-size:.62em;color:#94a3b8;margin-top:6px;font-style:italic}

.fov-table{font-size:.7em}



/* RESPONSIVE */

@media(max-width:900px){

  .compare-grid{grid-template-columns:1fr}

  .header{padding:6px 10px}

  .header h1{font-size:.82em}

  .header .sub{font-size:.6em}

  .page-tab{font-size:.72em;padding:8px 8px}

  .col-body{padding:6px !important}

  .search-box input{font-size:.76em;padding:6px 8px}

  .search-box button{padding:6px 10px;font-size:.7em}

  .search-tip{font-size:.6em;margin-bottom:4px}

  .series-tabs{gap:2px;margin-bottom:4px}

  .series-tab{padding:4px 6px;font-size:.65em}

  .param-table{font-size:.6em}

  .model-list-table{font-size:.58em}

  .links-row{gap:2px;margin-top:4px;padding-top:4px}

  .links-row a{padding:3px 6px;font-size:.65em}

  .comp-result-header{padding:6px 8px;font-size:.7em}

  .card-title{padding:5px 8px;font-size:.7em}

  .card-body{padding:6px 8px}

  .vs-row{padding:4px 6px;font-size:.65em;margin-top:4px}

}

</style>

</head>

// ==================== HIKVISION SEARCH ====================

function showHikSeries(key){

  currentHikSeries=key;

  renderHikSeries(key);

}

function lookupFOV(model){

  // 不自带镜头（机身 00C / NNN）的型号，规格书本身无物距-视野表，直接判定为“无数据”

  if(/NNN|00C/.test(model)) return null;

  if(realFOV[model]) return {rows: realFOV[model], src: model};

  const bm = model.match(/MV-SC\d+(?:[A-Za-z]+)?/);

  if(bm){

    const base = bm[0];

    const rest = model.slice(base.length);

    const fm2 = rest.match(/(\d+)/);

    const f = fm2 ? fm2[1].padStart(2,'0') : null;

    if(f === '00') return null; // 焦距 00 = 不自带镜头

    if(f && realFOV[base + '-' + f]) return {rows: realFOV[base + '-' + f], src: base + '-' + f};

    if(realFOVBase[base]) return {rows: realFOVBase[base], src: base};

  }

  return null;

}

function buildModelDetailCard(key, m, lks){

  const d=hikData[key]; if(!d||!m) return '';

  const model=m[0],res=m[1]||'-',focalStr=m[6]||'-';

  const colNames = (key==='sc2000x') ? {1:'分辨率',2:'传感器',3:'快门',4:'帧率(fps)',5:'黑白/彩色',6:'焦距',7:'AI/能力'} : (m.length>=9 ? {1:'分辨率',2:'像元/传感器',3:'靶面/快门',4:'帧率(fps)',5:'黑白/彩色',6:'焦距',7:'调焦方式',8:'AI/能力'} : {1:'分辨率',2:'像元/传感器',3:'靶面/快门',4:'帧率(fps)',5:'黑白/彩色',6:'焦距',7:'AI/能力'});

  let h=`<div class="model-detail-card"><div class="mdc-title">📷 ${model}</div><div class="mdc-body">`;

  h+=`<table class="param-table" style="min-width:300px"><thead><tr><th>参数</th><th>值</th></tr></thead><tbody>`;

  for(let i=1;i<m.length;i++){h+=`<tr><td>${colNames[i]||('参数'+i)}</td><td>${m[i]||'-'}</td></tr>`;}

  h+=`</tbody></table>`;

  const realFov = lookupFOV(model);

  const fm=(focalStr||'').match(/([\d.]+)\s*mm/);

  if(realFov && realFov.rows && realFov.rows.length){

    // 仅展示海康官方规格书“物距-视野”实测表（非公式计算）

    const rf = realFov.rows;

    const focals = Array.from(new Set(rf.map(r=>r.focal)));

    const showFocal = focals.length > 1;

    const focal0 = (rf[0] && rf[0].focal) ? rf[0].focal : (fm ? fm[1] : '');

    const titleFocal = showFocal ? '' : (focal0 ? (' · 焦距 '+focal0+'mm') : '');

    h+=`<div class="mdc-fov-title">📐 规格书实测视野（来源：海康官方规格书${titleFocal}）</div>`;

    h+=`<div class="table-scroll"><table class="model-list-table fov-table"><thead><tr><th>工作距离(mm)</th>${showFocal?'<th>焦距(mm)</th>':''}<th>视野宽H(mm)</th><th>视野高V(mm)</th><th>单像素精度(mm/pixel)</th></tr></thead><tbody>`;

    rf.forEach(r=>{ h+=`<tr><td>${r.wd}</td>${showFocal?('<td>'+(r.focal||'-')+'</td>'):''}<td>${r.fw}</td><td>${r.fh}</td><td>${r.pixel}</td></tr>`; });

    h+=`</tbody></table></div>`;

    h+=`<div class="fov-formula">数据来自海康官网对应型号规格书“物距-视野”实测表，非公式计算${showFocal?'（该型号含多焦距规格，已按焦距分组合并显示）':''}。</div>`;

  }else{

    // 规格书未提供物距-视野数据时：不展示任何计算/估算值，明确提示需自配镜头实测

    const noLens = /NNN|00C/.test(model) || (fm && parseFloat(fm[1])===0);

    if(noLens){

      h+=`<div class="fov-sensor">📐 规格书未提供物距-视野数据：<b>本型号不自带镜头</b>，需自行安装镜头后按实际配置实测视野，再补充到本地数据库。</div>`;

    }else{

      h+=`<div class="fov-sensor">📐 规格书未提供该型号物距-视野数据：需按实际镜头配置实测，或补充对应规格书后更新本表。</div>`;

    }

  }

  const lk=lks||{};

  h+=`<div class="links-row" style="margin-top:8px">

    <a class="link-site" href="${lk.site||d.url}" target="_blank">🏠 官网产品页</a>

    <a class="link-doc" href="${lk.doc||'#'}" target="_blank">💻 软件下载+问题库</a>

  </div>`;

  h+=`</div></div>`;

  return h;

}



function renderModelDetail(key,idx,evt){

  const d=hikData[key];if(!d)return;

  const mvsc=d.models.filter(m=>MAIN_RE.test(m[0]));

  const m=mvsc[idx];if(!m)return;

  const lks=hikLinks[key]||{};

  const el=document.getElementById('model-detail');

  if(el){el.innerHTML=buildModelDetailCard(key,m,lks);el.scrollIntoView({behavior:'smooth',block:'nearest'});}

  if(evt){document.querySelectorAll('.model-row').forEach(r=>r.classList.remove('selected'));evt.currentTarget.classList.add('selected');}

}



function buildSeriesSpecTable(key){

  const d=hikData[key];if(!d)return '';

  let h=`<div class="table-scroll"><table class="param-table">

  <thead><tr><th>参数项</th><th>值</th></tr></thead><tbody>`;

  for(const [k,v] of Object.entries(d.specs)){

    h+=`<tr${k.includes('AI')?' class="key-row"':''}><td>${k}</td><td>${v}</td></tr>`;

  }

  h+=`</tbody></table></div>`;

  return h;

}



function setHikTabActive(key){

  document.querySelectorAll('#hik-series-tabs .series-tab').forEach(t=>t.classList.remove('active','matched'));

  const idx={'sc1000':0,'sc2000':1,'sc2000x':2,'sc3000':3,'sc5000x':4,'sc6000':5,'sc6500':6};

  const tabs=document.querySelectorAll('#hik-series-tabs .series-tab');

  if(tabs[idx[key]])tabs[idx[key]].classList.add('active','matched');

}



function renderHikSeriesFull(key, topIdx){

  const d=hikData[key];if(!d)return;

  const lks=hikLinks[key]||{};

  const mvsc=d.models.filter(m=>MAIN_RE.test(m[0]));

  let h='';

  // 搜索命中具体型号时，参数详情置顶

  if(topIdx!=null && mvsc[topIdx]){

    h+=buildModelDetailCard(key, mvsc[topIdx], lks);

    h+=`<div class="search-tip" style="margin-top:10px;font-size:.72em">📂 所属系列：<b>${d.name}</b>　·　下方为该系列完整规格与型号参考</div>`;

  }

  h+=buildSeriesSpecTable(key);

  h+=`<div class="model-list-hint">📋 点击型号查看详细参数与物距视野（共 ${mvsc.length} 个 MV-SC 主系列型号）</div>`;

  h+=`<div class="table-scroll" style="margin-top:4px"><table class="model-list-table">

  <thead><tr><th>型号</th><th>分辨率</th><th>焦距</th><th>彩色</th><th>能力</th></tr></thead><tbody>`;

  mvsc.forEach((m,i)=>{

    h+=`<tr class="model-row" onclick="renderModelDetail('${key}',${i},event)"><td class="model-name">${m[0]}</td><td>${m[1]||'-'}</td><td>${m[6]||'-'}</td><td>${m[5]||'-'}</td><td>${m[m.length-1]||'-'}</td></tr>`;

  });

  h+=`</tbody></table></div>`;

  // 型号详情区

  h+=`<div id="model-detail"></div>`;

  // 系列链接

  h+=`<div class="links-row">

    <a class="link-site" href="${lks.site||d.url}" target="_blank">🏠 官网产品页</a>

    <a class="link-doc" href="${lks.doc||'#'}" target="_blank">💻 软件下载+问题库</a>

  </div>`;

  document.getElementById('hik-result').innerHTML=h;

}



function renderHikSeries(key){ renderHikSeriesFull(key, null); }



function renderHikResultWithDetail(key, idx){

  renderHikSeriesFull(key, idx);

  setHikTabActive(key);

  currentHikSeries=key;

  const d=hikData[key];

  const mvsc=d.models.filter(m=>MAIN_RE.test(m[0]));

  const m=mvsc[idx];

  document.getElementById('hik-tip').textContent='🔍 已找到型号: '+(m?m[0]:'');

}



function findMainModel(qRaw){

  const q=qRaw.trim().toLowerCase().replace(/[^a-z0-9]/g,'');

  if(!q)return null;

  let best=null,bestScore=0;

  for(const mc of _hikModelCache){

    let score=0;

    if(mc.norm===q)score=200;

    else if(mc.norm.startsWith(q))score=150;

    else if(mc.norm.includes(q))score=100;

    if(score>bestScore){bestScore=score;best={key:mc.key,idx:mc.idx};}

  }

  return bestScore>=100?best:null;

}



function doHikSearch(){

  const q=document.getElementById('hik-search').value.trim().toLowerCase();

  if(!q){renderHikSeries(currentHikSeries);document.getElementById('hik-tip').textContent='💡 搜型号如 SC3030、SC5020、SC6016 或搜关键词如 "边缘学习""全局快门""FINS"';return;}



  // 优先匹配具体型号 → 参数详情置顶显示

  const fm=findMainModel(q);

  if(fm){ renderHikResultWithDetail(fm.key, fm.idx); return; }



  // Try match series

  let bestKey=currentHikSeries,bestScore=0;

  const keys=Object.keys(hikData);

  for(const k of keys){

    let score=0;

    const ds=_hikSearchCache[k]; // Use pre-computed cache instead of JSON.stringify per search

    // Model number match

    if(q.replace(/[^a-z0-9]/g,'')&&ds.includes(q.replace(/[^a-z0-9]/g,'')))score+=100;

    // Keyword match

    const kw=q.split(/\s+/);kw.forEach(w=>{if(w&&ds.includes(w))score+=10;});

    if(score>bestScore){bestScore=score;bestKey=k;}

  }

  if(bestScore>0){

    showHikSeries(bestKey);

    document.getElementById('hik-tip').textContent='🔍 已匹配: '+hikData[bestKey].name;

    // Highlight matched series tab

    document.querySelectorAll('#hik-series-tabs .series-tab').forEach(t=>t.classList.remove('matched'));

    const idx={'sc1000':0,'sc2000':1,'sc2000x':2,'sc3000':3,'sc5000x':4,'sc6000':5,'sc6500':6};

    const tabs=document.querySelectorAll('#hik-series-tabs .series-tab');

    if(tabs[idx[bestKey]])tabs[idx[bestKey]].classList.add('matched');

    // Highlight matching rows

    setTimeout(()=>{

      const rows=document.querySelectorAll('#hik-result .param-table tr, #hik-result .model-list-table tr');

      const kw=q.split(/\s+/);

      rows.forEach(r=>{

        const txt=r.textContent.toLowerCase();

        if(kw.some(w=>w&&txt.includes(w)))r.classList.add('search-hit');

      });

      // Also highlight matching th

      document.querySelectorAll('#hik-result th').forEach(th=>{

        const txt=th.textContent.toLowerCase();

        if(kw.some(w=>w&&txt.includes(w)))th.classList.add('search-hit-col');

      });

    },50);

  }else{

    document.getElementById('hik-result').innerHTML='<div class="empty-state"><div class="big">🔍</div><p>未找到匹配的型号或参数<br>请尝试其他关键词或型号</p></div>';

    document.getElementById('hik-tip').textContent='❌ 未找到匹配';

  }

}



function clearHikSearch(){

  document.getElementById('hik-search').value='';

  renderHikSeries(currentHikSeries);

  document.getElementById('hik-tip').textContent='💡 搜型号如 SC3030、SC5020、SC6016 或搜关键词如 "边缘学习""全局快门""FINS"';

  document.querySelectorAll('#hik-series-tabs .series-tab').forEach(t=>t.classList.remove('matched'));

}





// ==================== FUZZY SEARCH (HIK ONLY) ====================



let _suggestIndex = null;

function buildSuggestIndex(){

  if(_suggestIndex) return _suggestIndex;

  _suggestIndex = [];

  // Hikvision models

  Object.keys(hikData).forEach(k=>{

    const d = hikData[k];

    const sks = d.searchKeys || [];

    (d.models||[]).forEach(row=>{

      if(!row||!row[0]||!MAIN_RE.test(row[0])) return;

      _suggestIndex.push({

        seriesKey:k, seriesName:d.name,

        searchKeys:sks,

        model:row[0], extra:(row.slice(1,3).join(' ')||''),

        searchText:(row.join(' ')+' '+d.name+' '+(d.searchKeys||[]).join(' ')).toLowerCase()

      });

    });

  });

  return _suggestIndex;

}



let _suggestActiveIdx = -1;

let _suggestCurrentList = [];

let _suggestTimer = null;



function _debounceSuggest(type) {

  clearTimeout(_suggestTimer);

  _suggestTimer = setTimeout(() => showSuggest(type), 150);

}



function showSuggest(){

  const input = document.getElementById('hik-search');

  const dd = document.getElementById('hik-suggest');

  const q = input.value.trim().toLowerCase();

  if(!q || q.length<1){ dd.classList.remove('show'); dd.innerHTML=''; _suggestCurrentList=[]; return; }



  const idx = buildSuggestIndex();

  const qn = q.replace(/[^a-z0-9\u4e00-\u9fff]/g,'');

  const results = [];

  for(const item of idx){

    let score = 0;

    const ml = item.model.toLowerCase();

    if(ml.startsWith(q)) score += 100;

    else if(ml.includes(q)) score += 60;

    if(qn && ml.replace(/[^a-z0-9]/g,'').includes(qn)) score += 80;

    if(item.searchText.includes(q)) score += 20;

    if(qn && item.searchText.replace(/[^a-z0-9\u4e00-\u9fff]/g,'').includes(qn)) score += 30;

    if(item.seriesName.toLowerCase().includes(q)) score += 15;

    if(score > 0) results.push({item, score});

  }

  results.sort((a,b)=>b.score-a.score);



  _suggestCurrentList = results.slice(0,12).map(r=>r.item);

  _suggestActiveIdx = -1;



  if(_suggestCurrentList.length === 0){

    dd.classList.remove('show');

    dd.innerHTML = '';

    return;

  }



  let html = '';

  _suggestCurrentList.forEach((item,i)=>{

    const seriesShort = (item.seriesName||'').replace(/系列.*/,'');

    html += '<div class="suggest-item" data-idx="'+i+'" onmousedown="clickSuggest('+i+');return false">'

      + '<span class="suggest-tag hik">海康</span>'

      + '<span class="suggest-model">'+item.model+'</span>'

      + '<span class="suggest-info">'+(item.extra||'')+'</span>'

      + '<span class="suggest-series">'+seriesShort+'</span>'

      + '</div>';

  });

  dd.innerHTML = html;

  dd.classList.add('show');

}



function clickSuggest(idx){

  const item = _suggestCurrentList[idx];

  if(!item) return;

  const input = document.getElementById('hik-search');

  const dd = document.getElementById('hik-suggest');

  input.value = item.model;

  dd.classList.remove('show');

  dd.innerHTML = '';

  _suggestCurrentList = [];

  // 选具体型号 → 参数详情置顶显示

  const d=hikData[item.seriesKey];

  if(d){

    const mvsc=d.models.filter(m=>MAIN_RE.test(m[0]));

    const mi=mvsc.findIndex(m=>m[0]===item.model);

    if(mi>=0){ renderHikResultWithDetail(item.seriesKey, mi); }

    else { showHikSeries(item.seriesKey); }

  }

  document.getElementById('hik-tip').textContent = '🔍 已选择: '+item.model+' ('+item.seriesName+')';

}



function suggestKeydown(e){

  const dd = document.getElementById('hik-suggest');

  if(e.key==='Enter'){

    if(_suggestActiveIdx >= 0 && _suggestCurrentList[_suggestActiveIdx]){

      e.preventDefault();

      clickSuggest(_suggestActiveIdx);

    } else {

      dd.classList.remove('show');

      doHikSearch();

    }

    return;

  }

  if(!_suggestCurrentList.length){

    if(e.key==='Enter') doHikSearch();

    return;

  }

  if(e.key==='ArrowDown'){

    e.preventDefault();

    _suggestActiveIdx = Math.min(_suggestActiveIdx+1, _suggestCurrentList.length-1);

    updateSuggestActive(dd);

  } else if(e.key==='ArrowUp'){

    e.preventDefault();

    _suggestActiveIdx = Math.max(_suggestActiveIdx-1, 0);

    updateSuggestActive(dd);

  } else if(e.key==='Escape'){

    dd.classList.remove('show');

    dd.innerHTML = '';

    _suggestCurrentList = [];

    _suggestActiveIdx = -1;

  }

}



function updateSuggestActive(dd){

  const items = dd.querySelectorAll('.suggest-item');

  items.forEach((el,i)=>{

    if(i===_suggestActiveIdx) el.classList.add('active');

    else el.classList.remove('active');

  });

  if(_suggestActiveIdx >= 0 && items[_suggestActiveIdx]){

    items[_suggestActiveIdx].scrollIntoView({block:'nearest'});

  }

}



// Close dropdown when clicking outside

document.addEventListener('click', function(e){

  if(!e.target.closest('.search-box')){

    document.querySelectorAll('.suggest-dropdown').forEach(dd=>{

      dd.classList.remove('show');

      dd.innerHTML = '';

    });

    _suggestCurrentList = [];

    _suggestActiveIdx = -1;

  }

});



// ==================== INIT ====================

renderHikSeries('sc3000');

</script>
